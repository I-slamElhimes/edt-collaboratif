<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ═══ HORLOGE (AGRANDIE) ═══ -->

  <!-- Cercle extérieur -->
  <circle cx="70" cy="80" r="56" fill="none" stroke="url(#brandGrad)" stroke-width="2.2" />

  <!-- Arc IA -->
  <path d="M 14 80 A 56 56 0 0 1 126 80" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Marqueurs principaux -->
  <rect x="66" y="18" width="8" height="12" rx="4" fill="#4F46E5" />
  <rect x="118" y="76" width="12" height="8" rx="4" fill="#6366F1" />
  <rect x="66" y="130" width="8" height="12" rx="4" fill="#8B5CF6" />
  <rect x="10" y="76" width="12" height="8" rx="4" fill="#A78BFA" />

  <!-- Petits marqueurs -->
  <rect x="98" y="26" width="5" height="5" rx="2.5" fill="#CBD5E1" />
  <rect x="98" y="129" width="5" height="5" rx="2.5" fill="#CBD5E1" />
  <rect x="37" y="129" width="5" height="5" rx="2.5" fill="#CBD5E1" />
  <rect x="37" y="26" width="5" height="5" rx="2.5" fill="#CBD5E1" />

  <!-- Grande aiguille (heures) -->
  <line x1="70" y1="80" x2="42" y2="46" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />

  <!-- Petite aiguille (minutes) -->
  <line x1="70" y1="80" x2="92" y2="52" stroke="#6366F1" stroke-width="3.5" stroke-linecap="round" />

  <!-- Centre -->
  <circle cx="70" cy="80" r="8" fill="white" stroke="url(#brandGrad)" stroke-width="3" />
  <circle cx="70" cy="80" r="3.5" fill="url(#brandGrad)" />

  <!-- Point IA -->
  <circle cx="88" cy="42" r="6" fill="#8B5CF6" opacity="0.8" />
  <circle cx="88" cy="42" r="3" fill="white" opacity="0.9" />

  <!-- ═══ TYPOGRAPHIE (AGRANDIE) ═══ -->

  <!-- EDT -->
  <text x="155" y="78" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="800" fill="#0F172A" letter-spacing="-1.5">
    EDT
  </text>

  <!-- Séparateur -->
  <rect x="285" y="54" width="2" height="34" rx="1" fill="#CBD5E1" />

  <!-- Collaboratif -->
  <text x="305" y="78" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="300" fill="#475569" letter-spacing="-0.5">
    Collaboratif
  </text>

  <!-- Tagline -->
  <text x="155" y="112" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="5.5" text-transform="uppercase">
    TIME MANAGEMENT · POWERED BY AI
  </text>

  <!-- Ligne décorative -->
  <rect x="155" y="124" width="60" height="2.5" rx="1.5" fill="url(#brandGrad)" />
</svg>