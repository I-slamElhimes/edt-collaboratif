{% extends 'base.html' %} Connexion — EDT Collaboratif {% block content %}
<div
  class="container d-flex justify-content-center align-items-center"
  style="min-height: 70vh"
>
  <div
    class="card shadow-lg border-0"
    style="
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 20px;
    "
  >
    <div class="card-body p-5">
      <h3 class="text-center mb-4 fw-bold" style="color: var(--text-primary)">
        Connexion
      </h3>

      <form method="POST">
        {% csrf_token %}

        <div class="mb-4">
          <label class="form-label small text-uppercase fw-bold text-muted"
            >Nom d'utilisateur</label
          >
          <input
            type="text"
            name="username"
            class="form-control bg-dark border-secondary text-white p-3"
            style="border-radius: 12px"
            required
          />
        </div>

        <div class="mb-4">
          <label class="form-label small text-uppercase fw-bold text-muted"
            >Mot de passe</label
          >
          <input
            type="password"
            name="password"
            class="form-control bg-dark border-secondary text-white p-3"
            style="border-radius: 12px"
            required
          />
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 p-3 fw-bold mb-3"
          style="
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
          "
        >
          Se connecter
        </button>
      </form>

      <div class="text-center mt-3">
        <p class="small text-muted">
          Pas encore de compte ?
          <a
            href="{% url 'accounts:inscription' %}"
            class="text-decoration-none"
            style="color: #a855f7; font-weight: 600"
            >S'inscrire</a
          >
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
