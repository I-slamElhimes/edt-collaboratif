{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — EDT Collaboratif</title>

    <link
      rel="icon"
      type="image/svg+xml"
      href="{% static 'img/logo-compact.svg' %}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <style>
      /* Reset body — override style.css padding-top for this standalone page */
      body {
        padding-top: 0 !important;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ── Wrapper ── */
      .login-page {
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        position: relative;
        z-index: 1;
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      /* ── Brand ── */
      .login-brand {
        text-align: center;
        margin-bottom: 2rem;
      }
      .login-brand img {
        height: 52px;
        filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.4));
        transition: transform 0.3s ease;
      }
      .login-brand img:hover {
        transform: scale(1.06) rotate(1deg);
      }

      /* ── Card ── */
      .login-card {
        background: var(--bg-card);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: var(--r-2xl);
        padding: 2.5rem 2.25rem;
        box-shadow:
          var(--shadow-lg),
          0 0 60px rgba(79, 70, 229, 0.06);
        position: relative;
        overflow: hidden;
      }

      /* Top glow inside card */
      .login-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 180px;
        background: radial-gradient(
          ellipse at 50% -20%,
          rgba(139, 92, 246, 0.12) 0%,
          transparent 70%
        );
        pointer-events: none;
      }

      /* Animated bottom line — same as topbar */
      .login-card::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: -60%;
        width: 40%;
        height: 2px;
        border-radius: 99px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--p2),
          var(--p3),
          var(--p1),
          transparent
        );
        animation: navLine 3.5s ease-in-out infinite;
        box-shadow: 0 0 10px rgba(139, 92, 246, 0.7);
        pointer-events: none;
      }

      .login-card-header {
        margin-bottom: 2rem;
        position: relative;
      }
      .login-card-header .ia-badge {
        margin-bottom: 1rem;
      }
      .login-card-header h2 {
        font-size: 1.45rem;
        font-weight: 800;
        color: var(--text-primary);
        letter-spacing: -0.02em;
        margin-bottom: 0.25rem;
      }
      .login-card-header p {
        font-size: 0.83rem;
        color: var(--text-muted);
        font-weight: 400;
      }

      /* ── Form labels ── */
      .form-label-custom {
        display: block;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 0.45rem;
      }

      /* ── Inputs ── */
      .input-wrap {
        position: relative;
        margin-bottom: 1.15rem;
      }
      .input-wrap .input-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 0.9rem;
        pointer-events: none;
        transition: color 0.2s;
      }
      .input-wrap input {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        padding: 0.8rem 1rem 0.8rem 2.75rem;
        color: var(--text-primary);
        font-family: var(--font);
        font-size: 0.875rem;
        outline: none;
        transition: all 0.2s ease;
      }
      .input-wrap input::placeholder {
        color: var(--text-muted);
      }
      .input-wrap input:focus {
        border-color: var(--border-accent);
        background: rgba(139, 92, 246, 0.05);
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
      }
      .input-wrap input:focus + .input-icon,
      .input-wrap:focus-within .input-icon {
        color: var(--p3);
      }

      /* ── Submit btn ── */
      .btn-login {
        width: 100%;
        padding: 0.85rem;
        border: none;
        border-radius: var(--r-md);
        background: linear-gradient(135deg, var(--p1) 0%, var(--p2) 100%);
        color: white;
        font-family: var(--font);
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.01em;
        box-shadow: 0 4px 20px var(--p1-glow);
        transition: all 0.22s ease;
        margin-top: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px var(--p1-glow);
        background: linear-gradient(135deg, #5b52f0 0%, #9d6ff7 100%);
      }
      .btn-login:active {
        transform: translateY(0);
      }

      /* ── Divider ── */
      .login-divider {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 1.5rem 0;
      }
      .login-divider::before,
      .login-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .login-divider span {
        font-size: 0.72rem;
        color: var(--text-muted);
        font-weight: 500;
        white-space: nowrap;
      }

      /* ── Footer ── */
      .login-footer-link {
        text-align: center;
        font-size: 0.82rem;
        color: var(--text-muted);
      }
      .login-footer-link a {
        color: var(--p3);
        font-weight: 600;
        text-decoration: none;
        transition: color 0.18s;
      }
      .login-footer-link a:hover {
        color: #c4b5fd;
      }

      /* ── Error alert ── */
      .alert-login {
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-left: 3px solid var(--danger);
        border-radius: var(--r-md);
        color: #fca5a5;
        font-size: 0.82rem;
        font-weight: 500;
        padding: 0.7rem 0.9rem;
        margin-bottom: 1.25rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        animation: fadeIn 0.3s ease;
      }

      /* Reuse animations from style.css */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes navLine {
        0% {
          left: -50%;
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          left: 110%;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-page">
      <div class="login-container">
        <!-- Brand -->
        <div class="login-brand">
          <img src="{% static 'img/logo.svg' %}" alt="EDT Collaboratif" />
        </div>

        <!-- Card -->
        <div class="login-card">
          <div class="login-card-header">
            <!-- IA badge — same as used across the app -->
            <div class="ia-badge">
              <span class="ia-dot"></span>
              EDT Collaboratif
            </div>
            <h2>Bon retour 👋</h2>
            <p>Connectez-vous à votre espace de travail</p>
          </div>

          <!-- Error messages -->
          {% if messages %} {% for message in messages %}
          <div class="alert-login">
            <i class="bi bi-exclamation-circle-fill"></i>
            {{ message }}
          </div>
          {% endfor %} {% endif %}

          <form method="POST" novalidate>
            {% csrf_token %}

            <div>
              <label class="form-label-custom">Nom d'utilisateur</label>
              <div class="input-wrap">
                <i class="bi bi-person input-icon"></i>
                <input
                  type="text"
                  name="username"
                  placeholder="votre_identifiant"
                  autocomplete="username"
                  required
                />
              </div>
            </div>

            <div>
              <label class="form-label-custom">Mot de passe</label>
              <div class="input-wrap">
                <i class="bi bi-lock input-icon"></i>
                <input
                  type="password"
                  name="password"
                  placeholder="••••••••"
                  autocomplete="current-password"
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn-login">
              <i class="bi bi-box-arrow-in-right"></i>
              Se connecter
            </button>
          </form>
         </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
