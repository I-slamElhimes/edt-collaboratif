{% extends 'base.html' %} {% block title %}Inscription — EDT Collaboratif
{%endblock %} {% block content %}
<div
  class="container d-flex justify-content-center align-items-center"
  style="min-height: 80vh"
>
  <div
    class="card shadow-lg border-0"
    style="
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 20px;
    "
  >
    <div class="card-body p-5">
      <h3 class="text-center mb-4 fw-bold" style="color: var(--text-primary)">
        Créer un compte
      </h3>
      <form method="POST">
        {% csrf_token %} {% for field in form %}
        <div class="mb-3">
          <label class="form-label small text-uppercase fw-bold text-muted"
            >{{ field.label }}</label
          >
          {{ field }} {% if field.errors %}
          <div class="text-danger small">{{ field.errors }}</div>
          {% endif %}
        </div>
        {% endfor %}
        <button
          type="submit"
          class="btn btn-primary w-100 p-3 fw-bold mt-3"
          style="
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
          "
        >
          S'inscrire
        </button>
      </form>
      <div class="text-center mt-4">
        <p class="small text-muted">
          Déjà un compte ?
          <a
            href="{% url 'accounts:connexion' %}"
            class="text-decoration-none"
            style="color: #a855f7"
            >Se connecter</a
          >
        </p>
      </div>
    </div>
  </div>
</div>

<style>
  input {
    display: block;
    width: 100%;
    padding: 0.75rem 1rem;
    background-color: #111 !important;
    border: 1px solid #333 !important;
    border-radius: 12px !important;
    color: white !important;
  }
</style>
{% endblock %}
